name: Lean 4 Formal Proof & TRL-5 Silicon Attestation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-formal-proofs:
    name: Machine-Check Lean 4 Hardware Theorems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Attestation Repository
        uses: actions/checkout@v4

      - name: Install Microsoft Lean 4 (elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify 0 Sorry Axioms in Proof Source
        run: |
          echo "Scanning SheafCosetIsometry.lean for unproven axioms..."
          if grep -v '^[[:space:]]*--' formal_lean4/SheafCosetIsometry.lean | grep -w 'sorry'; then
            echo "[FATAL] Found unproven 'sorry' axiom in formal proof!"
            exit 1
          fi
          echo "[PASS] Zero 'sorry' axioms detected."

      - name: Compile & Machine-Check Proofs with Lean 4 Kernel
        run: |
          lean formal_lean4/SheafCosetIsometry.lean
          echo "[PASS] All 7 Constructive Theorems Machine-Verified."

  audit-silicon-receipts:
    name: Validate Cryptographic SHA-256 Hardware Ledger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Attestation Repository
        uses: actions/checkout@v4

      - name: Audit JSON Receipt & Hash Digest Integrity
        run: |
          python3 -c "
          import json, hashlib, os
          with open('reports_public/TRL6_PUBLIC_VERIFICATION_RECEIPT.json') as f:
              receipt = json.load(f)
          
          # Verify Lean proof matches internal manifest hash
          with open('formal_lean4/SheafCosetIsometry.lean', 'rb') as f:
              lean_hash = hashlib.sha256(f.read()).hexdigest()
          
          manifest = receipt['sha256_artifact_manifest']
          print(f'Calculated Lean 4 Hash: {lean_hash}')
          print(f'Manifest Stated Hash  : {manifest[\"formal_lean4/SheafCosetIsometry.lean\"]}')
          assert lean_hash == manifest['formal_lean4/SheafCosetIsometry.lean'], 'Hash mismatch in Lean proof!'
          print('[PASS] Cryptographic receipt manifest verified.')
          "