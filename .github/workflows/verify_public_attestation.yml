name: Lean 4, 10k-Flit Fuzzer, C ABI & Zero-Knowledge RTL Synthesis

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify-five-oracles:
    name: 5-Oracle Formal, Silicon, C11 mmap & Control-Plane Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Canonical Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Oracle 1 -- Lean 4 Zero-Axiom Kernel (All 38 Theorem Groups thm00..thm37) & SAT Miter
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          TOOLCHAIN=$(tr -d '\r\n' < formal_lean4/lean-toolchain)
          ~/.elan/bin/elan toolchain install $TOOLCHAIN
          ~/.elan/bin/elan default $TOOLCHAIN
          rm -f /tmp/lean_axioms.log
          for f in formal_lean4/*.lean; do
            echo '=== [Lean 4 Kernel] Typechecking '$f' ==='
            ~/.elan/bin/lean $f | tee -a /tmp/lean_axioms.log
          done
          if grep -iE 'sorryAx|Classical\.choice|propext|Quot\.sound' /tmp/lean_axioms.log; then
            echo 'ERROR: Non-constructive axiom detected in Lean 4 output!'
            exit 1
          fi
          AXIOM_FREE_CNT=$(grep -c 'does not depend on any axioms' /tmp/lean_axioms.log || true)
          echo 'Verified '$AXIOM_FREE_CNT' zero-axiom constructive theorem declarations across all 3 Lean files.'
          test $AXIOM_FREE_CNT -ge 38

      - name: Oracle 2 & 4 -- Vivado xcvu47p Silicon Audit, Causal DAG, 40k-Slot Fuzzer & Loopback
        run: |
          echo '=== [1/4] Verifying 235-Artifact SHA256SUMS.txt on Clean Checkout ==='
          sha256sum -c SHA256SUMS.txt
          echo '=== [2/4] Running 5-Pillar Repository & Post-Route Vivado/ASAP7 Auditor ==='
          python3 tests/run_5pillar_repo_auditor.py
          echo '=== [3/4] Running 40k-Slot CXL Fuzzer, 100k BAR0 Loopback & Martingale Telemetry ==='
          python3 tests/test_flit_fuzzer.py
          python3 tests/test_stage0_pcie_bar0_mmio_loopback.py
          python3 tests/test_silicon_signoff.py
          python3 tests/test_trl6_subsystem_integration.py
          python3 sim/cxl_subflit_sanitizer_twin.py
          python3 sim/cluster_tco_calculator.py
          python3 sim/benchmark_workload_and_martingale.py
          echo '=== [4/4] Restoring Canonical Tracked Receipts Post-Simulation ==='
          git checkout -- .
          git clean -fd
          sha256sum -c SHA256SUMS.txt > /dev/null

      - name: Oracle 3 -- Compile & Audit ANSI-C Bare-Metal 16-CSR BAR0 Driver Header
        run: |
          gcc -std=c11 -O3 -Wall -Wextra -Werror -Iregisters tests/test_bar0_driver.c -o /tmp/test_bar0_driver
          /tmp/test_bar0_driver
          gcc -std=c11 -O3 -Wall -Wextra -Werror -Iregisters -c driver_cxl_vfio/spectral_cxl_vfio.c -o /tmp/spectral_cxl_vfio.o
          gcc -std=c11 -O3 -Wall -Wextra -Werror -Iregisters tests/test_aws_f2_trl6_hil.c -o /tmp/test_aws_f2_trl6_hil
          /tmp/test_aws_f2_trl6_hil --dry-run-selfcheck
          gcc -std=c11 -O3 -Wall -Wextra -Werror -Iregisters tests/test_agilex_cxl_trl7_hil.c -o /tmp/test_agilex_cxl_trl7_hil
          /tmp/test_agilex_cxl_trl7_hil --dry-run-selfcheck
          rm -f /tmp/test_bar0_driver /tmp/spectral_cxl_vfio.o /tmp/test_aws_f2_trl6_hil /tmp/test_agilex_cxl_trl7_hil

      - name: Oracle 5 -- Ephemeral RAM-Disk Gate-Level Bi-Simulation, SAT Miter & Control-Plane Audit
        env:
          SPECTRAL_VAULT_RTL_B64: ${{ secrets.SPECTRAL_VAULT_RTL_B64 }}
        run: bash sim/run_secret_vault_rtl.sh

      - name: Post Checkout Clean-Slate Verification Ledger
        run: |
          git checkout -- .
          git clean -fd
          git status --porcelain
          test -z "$(git status --porcelain)"
          sha256sum -c SHA256SUMS.txt > /dev/null
          echo '[CLEAN-SLATE LEDGER PASS] Working tree clean & all 235 SHA-256 digests verified.'

      - name: Sigstore / GitHub OIDC SLSA Build Provenance Attestation
        if: github.event_name == 'push' && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            SBOM.cdx.json
            SHA256SUMS.txt
            preprint_Murphy_v1_0_0.pdf
            reports_public/PUBLIC_VERIFICATION_RECEIPT.json
